name: Release

# Push a tag like v0.1.0 (or run manually) to publish a GitHub Release with the APK attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AuraIsland-debug-apk
          path: dist

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Name the APKs
        run: |
          cp dist/AuraIsland-debug.apk "dist/AuraIsland-${{ steps.tag.outputs.name }}.apk"
          mv dist/AuraIsland-debug.apk dist/AuraIsland.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Aura Island ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: dist/*.apk
