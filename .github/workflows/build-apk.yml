name: Build APK and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d platforms/android ]; then
            cordova platform add android
          fi

      - name: Add Aura Island plugin
        run: |
          if ! cordova plugin ls | grep -qi "aura-island"; then
            cordova plugin add ./native/cordova-plugin-aura-island
          fi

      - name: Build APK
        run: cordova build android --debug

      - name: Rename APK
        run: |
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk Auraland.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Auraland v${{ github.run_number }}
          body: "Automated APK build from commit ${{ github.sha }}"
          files: Auraland.apk
