name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Pinned: this image ships the Android SDK, so no extra SDK action is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cordova runs `gradle wrapper` itself, so a Gradle on PATH is required.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Show toolchain
        run: |
          node --version
          java -version
          gradle --version
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install Cordova
        run: npm install

      - name: Add Android platform and native plugin
        run: |
          npx cordova platform add android@13.0.0
          npx cordova plugin add ./native/cordova-plugin-aura-island

      - name: Build debug APK
        run: npx cordova build android --debug

      - name: Name the APK
        run: |
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk dist/AuraIsland-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraIsland-debug-apk
          path: dist/AuraIsland-debug.apk
          if-no-files-found: error
